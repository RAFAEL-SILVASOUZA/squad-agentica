  <!--
    Marca do Grupo Supero — o MESMO vetor de `MarcaSupero` (packages/ui) e do
    loader em index.html. Copiado, e não importado: o favicon é servido como
    arquivo estático, antes de qualquer JavaScript existir.

    A viewBox é quadrada e centrada no símbolo (que mede 162×188 a partir de
    7,41), com folga em volta. Sem isso o ícone encostaria nas bordas da aba:
    num quadrado de 16px, a margem é o que separa a marca do favicon do vizinho.

    Sem fundo, de propósito: o laranja tem contraste tanto com a barra clara
    quanto com a escura do navegador, e um retângulo branco cravado apareceria
    como uma etiqueta no tema noturno.
