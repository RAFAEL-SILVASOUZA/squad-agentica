[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Orquestrador de pipelines de agentes (FastAPI + LangGraph) — Agent Portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.35",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.10",
    "alembic==1.14.1",
    "python-dotenv==1.0.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "pyyaml==6.0.2",
    "python-jose[cryptography]==3.3.0",
    "python-json-logger==2.0.7",
    "langgraph==0.2.61",
    "langgraph-checkpoint==2.0.9",
    "langgraph-checkpoint-postgres==2.0.10",
    "langchain-core==0.3.28",
    "pgvector==0.3.6",
    "httpx==0.28.1",
    "openai==1.58.1",
    "bcrypt==4.2.0",
    "minio==7.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.11.0",
    "mypy==1.13.0",
    "watchfiles==1.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
