# Agent Portal — stack V1 (6 serviços + init one-shot).
# Dono: infra-docker. Sem `version:` (obsoleto no Compose v2+).
# Portas internas fixas (contrato §2.1). Publicadas só as que não colidam com o host.
# Healthchecks usam binários que **existem** na imagem (ver Dockerfiles/contrato §4).

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: agent-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_portal
      POSTGRES_PASSWORD: agent_portal
      POSTGRES_DB: agent_portal
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_portal -d agent_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: agent-portal-garage
    restart: unless-stopped
    # Sem --single-node: esse modo recusa subir quando o layout já passou da
    # versão 1 (o que acontecia após o garage-init), e o stack não voltava
    # depois de reiniciar o Docker. O layout é aplicado uma vez pelo
    # garage-init e persiste no volume.
    command: ["/garage", "server"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      # Daemon respondendo via RPC (não exige layout: num volume novo quem
      # aplica o layout é o garage-init, que depende deste healthcheck).
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "--rpc-secret", "${GARAGE_RPC_SECRET}", "--admin-token", "${GARAGE_ADMIN_TOKEN}", "node", "id", "-q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  garage-init:
    # F5: o init original (python + minio via API S3) NÃO conseguia importar
    # a access key S3 (`garage key import` é CLI-only). Em volume novo a key
    # não existia e NENHUM bucket podia ser criado (AccessDenied em agents,
    # skills e knowledge -> todo upload de KB dava 500 storage_error). O novo
    # bootstrap roda o binário `garage` (CLI) via garage/init.sh: key import,
    # bucket create e bucket allow, incluindo o bucket `knowledge`.
    build:
      context: ./garage
      dockerfile: Dockerfile.init
    container_name: agent-portal-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://garage:3900}
      MINIO_BUCKET_AGENTS: ${MINIO_BUCKET_AGENTS:-agents}
      MINIO_BUCKET_SKILLS: ${MINIO_BUCKET_SKILLS:-skills}
      MINIO_BUCKET_KNOWLEDGE: ${MINIO_BUCKET_KNOWLEDGE:-knowledge}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      # O CLI precisa do node key do nó em execução para autenticar no RPC
      # (``garage health``/``key import``/``bucket allow`` lê
      # /var/lib/garage/meta); o acesso é só-leitura.
      - garage-data:/var/lib/garage:ro
    restart: "no"

  orchestrator:
    build:
      context: ./agent-orchestrator
      dockerfile: Dockerfile
    container_name: agent-portal-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agent_portal:agent_portal@postgres:5432/agent_portal}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      WORKER_TOKEN: ${WORKER_TOKEN:-change-me-in-prod}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adminkey01}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-prod}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://garage:3900}
      MINIO_BUCKET_AGENTS: ${MINIO_BUCKET_AGENTS:-agents}
      MINIO_BUCKET_SKILLS: ${MINIO_BUCKET_SKILLS:-skills}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-prod}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      INTEGRATIONS_SECRET_KEY: ${INTEGRATIONS_SECRET_KEY:-}
      # GitHub: base da API (real por padrão). SÓ EM TESTE: apontar para o
      # fake do serviço git-test (http://git-test:8080) e sobrescrever a URL
      # de clone para o git daemon (git://git-test) — ver serviço git-test.
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GIT_CLONE_BASE_OVERRIDE: ${GIT_CLONE_BASE_OVERRIDE:-}
      # Workspace por run (clone do repositório), compartilhado com o worker.
      WORKSPACES_DIR: /workspaces
      WORKSPACE_RETENTION_DAYS: ${WORKSPACE_RETENTION_DAYS:-7}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Agent Portal}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-agent-portal@localhost}
      # Repositório git de cada run (--separate-git-dir): SÓ no orchestrator,
      # volume próprio (project-gitdirs), fora do volume do worker.
      GIT_DIRS_DIR: /var/lib/agent-portal/gitdirs
      MCP_CAPABILITY_SECRET: ${MCP_CAPABILITY_SECRET:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost}
    volumes:
      - ./agent-orchestrator:/app:ro
      - project-workspaces:/workspaces
      - project-gitdirs:/var/lib/agent-portal/gitdirs
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agent-worker:
    # Ponte interna de ferramentas MCP (não passa pelo nginx público).
    build:
      context: ./agent-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    # F20 (privilégio mínimo): sem env_file; o worker recebe só o que usa
    # (nada de GARAGE_RPC_SECRET/GARAGE_ADMIN_TOKEN, JWT ou banco).
    environment:
      ORCHESTRATOR_INTERNAL_URL: http://orchestrator:8000
      WORKER_TOKEN: ${WORKER_TOKEN:-change-me-in-prod}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adminkey01}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-prod}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://garage:3900}
      MINIO_BUCKET_AGENTS: ${MINIO_BUCKET_AGENTS:-agents}
      MINIO_BUCKET_SKILLS: ${MINIO_BUCKET_SKILLS:-skills}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Workspace do run: as ferramentas do agente ficam confinadas a ele.
      WORKSPACES_DIR: /workspaces
    volumes:
      - ./agent-worker:/app:ro
      - project-workspaces:/workspaces
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      # wget --spider envia HEAD; a rota /health é GET-only (FastAPI) -> 405.
      # Usa GET explícito (wget -q -O /dev/null) para o healthcheck passar.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Sem porta publicada (contrato §2.1): acessível só pelo server block interno NGINX :8081.

  portal:
    build:
      context: ./agent-portal
      dockerfile: Dockerfile
    container_name: agent-portal-portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-prod}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost/}
      ORCHESTRATOR_API_URL: ${ORCHESTRATOR_API_URL:-http://nginx:80}
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: agent-portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # §2.4: o NGINX precisa ter WORKER_TOKEN no ambiente (validação/logging;
      # o header X-Worker-Token é repelado pelo orchestrator, §2.3).
      WORKER_TOKEN: ${WORKER_TOKEN:-change-me-in-prod}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d/*.conf (server blocks públicos :80 e interno :8081) só é carregado
      # se este mount existir; sem ele o NGINX sobe sem nenhuma rota (infra-nginx).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      portal:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      agent-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      # wget --spider envia HEAD; a rota /api/health é GET-only (FastAPI) -> 405.
      # Usa GET explícito (wget -q -O /dev/null) e 127.0.0.1 (evita resolução IPv6).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  git-test:
    # SÓ TESTE (perfil "test"; não sobe no `up` normal): git daemon com os
    # repositórios bare em /srv/git (git://git-test/<dono>/<nome>.git, push
    # liberado) + GitHub fake em :8080 (tests/integration/fake_git_api.py).
    # Usa a imagem do orchestrator (já tem git-daemon e python; alpine/git não
    # traz o git-daemon). Suba com:
    #   docker compose -p squad-agentica --profile test up -d git-test
    # e aponte o orchestrator para ele com GITHUB_API_BASE=http://git-test:8080
    # GIT_CLONE_BASE_OVERRIDE=git://git-test (ver qa-projeto-git.md).
    profiles: ["test"]
    build:
      context: ./agent-orchestrator
      dockerfile: Dockerfile
    container_name: agent-portal-git-test
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /srv/git && git daemon --reuseaddr --export-all --enable=receive-pack --base-path=/srv/git --detach /srv/git && exec python /qa/fake_git_api.py
    volumes:
      - git-test-repos:/srv/git
      - ./tests/integration/fake_git_api.py:/qa/fake_git_api.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  garage-data:
  project-workspaces:
  # Só o orchestrator monta (repositórios git privados dos runs).
  project-gitdirs:
  git-test-repos:
