# Agent Portal — Internal server (:8081) — Worker pool
# Dono: infra-nginx
#
# Este server NÃO é publicado no host (contrato §2.1).
# Só é acessível de dentro da rede Docker.
#
# O orchestrator chama: POST http://nginx:8081/execute
# O worker expõe:       POST /execute
#
# Round-robin: usa resolver DNS do Docker (127.0.0.11) com variável
# no proxy_pass. O Docker DNS retorna todos os IPs do serviço
# agent-worker; o nginx faz round-robin entre eles.
#
# Sobrevive a recriação de containers: o nome DNS é re-resolvido
# a cada request (valid=10s). Sem upstream block estático.
#
# Header X-Worker-Token: repassado do ambiente do NGINX
# (WORKER_TOKEN no .env, injetado pelo docker-compose).

server {
    listen 8081;
    server_name _;

    # Resolver DNS do Docker (interno, só funciona dentro da rede)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Timeout compatível com execução de agente (contrato §2.3:
    # o orchestrator manda timeout no body; o NGINX precisa ter
    # timeout >= o máximo esperado. 300s cobre o caso mais longo
    # de V1; o worker_client aplica retry com backoff 2/4/8s)
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Body do execute pode ser grande (inputs de agente)
    client_max_body_size 10m;

    # ============================================================
    # POST /execute → agent-worker pool (round-robin)
    #
    # Com variável no proxy_pass, o URI original é repassado intacto.
    # O orchestrator chama /execute; o worker recebe /execute.
    #
    # O Docker DNS (127.0.0.11) resolve agent-worker para todos os
    # IPs do serviço. O nginx faz round-robin entre eles.
    #
    # Limitação: sem keepalive (variável no proxy_pass não permite
    # upstream block). Para V1 local (1-2 workers) o impacto é
    # negligível. Documentado no README.
    # ============================================================

    location /execute {
        set $worker_upstream http://agent-worker:9000;
        proxy_pass $worker_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Token de autenticação do worker (contrato §2.3).
        # O orchestrator envia X-Worker-Token no request;
        # o NGINX o repassa por default (pass-through de headers
        # do client para o upstream). Não é preciso proxy_set_header.
        #
        # O WORKER_TOKEN está no ambiente do NGINX (exigência do
        # contrato §2.4) para validação futura ou logging, mas a
        # injeção é feita pelo orchestrator (worker_client).

        # Sem buffering: resposta do worker pode ser grande (outputs)
        proxy_buffering off;
    }

    # Health do worker pool (para debug/verificação interna)
    location /health {
        set $worker_upstream http://agent-worker:9000;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
