# Agent Portal — Upstreams
# Dono: infra-nginx
#
# Portal e Orchestrator: upstreams estáticos (1 réplica, nome DNS fixo).
# Agent-Worker: usa resolver dinâmico (127.0.0.11) com variável para
#   sobreviver a recriação de containers e suportar escala horizontal
#   (docker compose --scale agent-worker=N).
#
# Nota: com variável no proxy_pass, não se pode usar upstream block.
#   O round-robin é feito pelo resolver DNS do Docker (retorna todos os IPs).
#   keepalive não é disponível neste caso; aceitável para V1 local.

# Portal (Next.js) — 1 réplica, nome estável
upstream portal {
    server portal:3000;
    keepalive 32;
}

# Orchestrator (FastAPI) — 1 réplica, nome estável
upstream orchestrator {
    server orchestrator:8000;
    keepalive 32;
}

# Agent-Worker pool — N réplicas (escala horizontal)
# Não usa upstream block: precisa de resolver dinâmico para sobreviver
# a recriação de containers (IP muda). O round-robin é feito pelo
# Docker DNS (127.0.0.11) que retorna todos os IPs do serviço.
#
# Uso: set $worker_upstream http://agent-worker:9000;
#      proxy_pass $worker_upstream;
#
# Limitação documentada: sem keepalive no worker pool. Para V1 local
# (1-2 workers) o impacto é negligível. Em produção com N workers,
# considerar um load balancer dedicado ou nginx-plus.
