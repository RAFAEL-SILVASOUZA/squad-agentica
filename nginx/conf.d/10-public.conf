# Agent Portal — Public server (:80)
# Dono: infra-nginx
#
# Tabela de precedência (contrato §2.2):
#   1. location = /api/auth, location /api/auth/  → portal (NextAuth)
#   2. location = /api/session-token              → portal (route handler)
#   3. location = /api/ws                         → orchestrator (WebSocket)
#   4. location /api/agents/chat, /api/agents/.../chat → orchestrator (SSE)
#   5. location /api/                             → orchestrator (mantém prefixo)
#   6. location /                                 → portal (SPA, assets, HMR)
#
# Regras:
#   - Sem rate limiting (spec 14.1: rate limiting na aplicação, 429 JSON)
#   - Sem rota para workers (só server interno :8081)
#   - client_max_body_size 25m (upload de knowledge, multipart)
#   - SSE: proxy_buffering off + timeouts longos nas rotas de streaming
#   - WebSocket: Upgrade/Connection + timeouts longos
#   - HMR do next dev: WebSocket em /_next/webpack-hmr (portal)

server {
    listen 80;
    server_name _;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }

    # Upload de knowledge (multipart) — spec 9.3
    client_max_body_size 25m;

    # Headers de segurança (V1 local: sem CSP, sem HSTS)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ============================================================
    # PRECEDÊNCIA 1: Auth (dividido entre portal e orchestrator)
    #
    # NextAuth (portal): /api/auth/callback/*, /api/auth/signin,
    #   /api/auth/signout, /api/auth/csrf, /api/auth/session,
    #   /api/auth/providers
    #
    # Orchestrator (FastAPI): /api/auth/register, /api/auth/login,
    #   /api/auth/refresh, /api/auth/me, /api/auth/preferences
    #
    # O browser chama /api/auth/register diretamente (via NGINX).
    # O login é feito via NextAuth (authorize() chama o orchestrator
    # internamente, não via NGINX).
    # ============================================================

    # Exact match: /api/auth (sem barra final) → portal
    location = /api/auth {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Orchestrator auth endpoints (contrato §5)
    location = /api/auth/register {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/auth/login {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/auth/refresh {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/auth/me {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Adendo 9: preferências (padrão de LLM/embedding) no orchestrator.
    location = /api/auth/preferences {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # NextAuth routes (portal)
    location /api/auth/ {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================================
    # PRECEDÊNCIA 2: Session token (portal)
    # GET /api/session-token — route handler que devolve o JWT
    # ============================================================

    location = /api/session-token {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================================
    # PRECEDÊNCIA 3: WebSocket (orchestrator)
    # /api/ws?token=<JWT> — conexão única, upgrade WebSocket
    # Sem barra final: location = /api/ws (exact)
    # ============================================================

    location = /api/ws {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para WebSocket (conexão persistente)
        proxy_connect_timeout 75s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Sem buffering para WebSocket
        proxy_buffering off;
    }

    # ============================================================
    # PRECEDÊNCIA 4: SSE streaming (orchestrator)
    # POST /api/agents/chat e POST /api/agents/{id}/chat
    # proxy_buffering off + timeouts longos (spec 9.2)
    #
    # Nota: nginx não diferencia por método HTTP no location.
    # Estas rotas são POST-only na aplicação; GET cairia aqui
    # mas a API responderia 405. Sem impacto prático.
    # ============================================================

    # Chat de construção (sem id)
    location = /api/agents/chat {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: desabilita buffering, timeouts longos
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        chunked_transfer_encoding on;
    }

    # Chat de edição (com id): /api/agents/{uuid}/chat
    # Usa regex para capturar o UUID dinâmico
    location ~ ^/api/agents/[^/]+/chat$ {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: desabilita buffering, timeouts longos
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        chunked_transfer_encoding on;
    }

    # ============================================================
    # PRECEDÊNCIA 5: API FastAPI (orchestrator)
    # /api/* → mantém o prefixo /api
    # proxy_pass com URI: o prefixo /api/ é preservado
    # ============================================================

    location /api/ {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================================
    # PRECEDÊNCIA 5.5: MCP Server (orchestrator)
    # /mcp/mcp — servidor MCP (streaming, long-polling)
    # /oauth/* — endpoints OAuth 2.1 (DCR, authorize, token, revoke)
    # /.well-known/oauth-* — metadata OAuth (PRM, ASM)
    # ============================================================

    # MCP server (streaming: proxy_buffering off, timeouts longos)
    # Só o endpoint /mcp/mcp vai para o orchestrator.
    # As páginas do portal (/mcp, /mcp/server) caem em location / → portal.
    location /mcp/mcp {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming MCP: desabilita buffering, timeouts longos
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        chunked_transfer_encoding on;
    }

    # OAuth 2.1 endpoints (DCR, authorize, token, revoke, refresh)
    location /oauth/ {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # OAuth metadata (RFC 9728 PRM, RFC 8414 ASM)
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================================
    # PRECEDÊNCIA 6: Portal (Next.js)
    # Tudo o resto: SPA, /_next/ assets, HMR WebSocket, estáticos
    # /mcp-consent cai aqui (location / → portal)
    # ============================================================

    # HMR do next dev (WebSocket) — /_next/webpack-hmr
    # Em produção (next build) esta rota não existe; em dev é essencial.
    location /_next/webpack-hmr {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets do Next.js (cache longo)
    # Nota: add_header neste location sobrescreve os do server level
    # (comportamento do nginx). Repetir headers de segurança aqui.
    location /_next/static/ {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Resto do portal (SPA, páginas, API do Next.js)
    location / {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
