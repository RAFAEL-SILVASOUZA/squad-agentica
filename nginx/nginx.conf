# Agent Portal — NGINX main config
# Dono: infra-nginx (contrato §9, FASE 1)
# Imagem: nginx:1.27-alpine (contrato §3)
#
# Estrutura:
#   - events: worker_processes auto
#   - http:   includes conf.d/*.conf (upstreams, public server :80, internal server :8081)
#
# Regras de precedência (contrato §2.2):
#   1. location = /api/auth, location /api/auth/  → portal:3000 (NextAuth)
#   2. location = /api/session-token              → portal:3000
#   3. location = /api/ws                         → orchestrator:8000 (WebSocket)
#   4. location /api/                             → orchestrator:8000 (mantém prefixo)
#   5. location /                                 → portal:3000 (SPA, assets, HMR)
#
# Worker: NUNCA acessível pela :80. Só pelo server interno :8081.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip (portal assets)
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Buffers
    client_body_buffer_size   128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Proxy defaults
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;
    proxy_buffers         16 8k;
    proxy_busy_buffers_size 16k;

    # Hide nginx version
    server_tokens off;

    # Include server configs (upstreams + public + internal)
    include /etc/nginx/conf.d/*.conf;
}
