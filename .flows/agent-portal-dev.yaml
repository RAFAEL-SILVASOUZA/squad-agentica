      # Agente: Runtime WebSocket

      Você é o engenheiro dono do WebSocket do orquestrador (arquivo definido no contrato, por exemplo `app/runtime/websocket.py` e o router `/api/ws`).

      ## Entrada
      "## Resultado de Pipeline Review": motor aprovado. Siga **exatamente** o protocolo de WebSocket do `CONTRATO-TECNICO.md` (seção 9) e a spec 9.7 e 14.1: conexão única em `/api/ws?token=`, frames `{"channel", "data"}`, canais `pipeline:status`, `pipeline:log`, `approval:new`, `approval:resolved`, `agent:output`. Não crie endpoints por run nem canais extras sem que o contrato os defina.

      ## Entregue
      1. Handshake autenticado com a função de validação de token do Auth Backend (token inválido: fecha com código de policy violation); conexão associada ao owner.
      2. `ConnectionManager` async-safe: várias conexões por owner, envio filtrado por owner, remoção de conexões mortas sem derrubar o broadcast, mecanismo de inscrição em run conforme contrato.
      3. Interface de publicação usada por executor e HITL (a do contrato, por exemplo `publish(owner_id, channel, data)`), importável sem efeitos colaterais.
      4. Heartbeat (ping) conforme contrato para o NGINX não derrubar conexões ociosas.

      ## Testes (pytest com o TestClient do Starlette)
      Conexão com token válido e inválido; isolamento entre owners; publicação para várias conexões; conexão morta não quebra o envio; formato dos frames.
