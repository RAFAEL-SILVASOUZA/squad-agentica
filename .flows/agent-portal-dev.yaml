      3. Dependency `get_current_user` para as rotas protegidas. A proteção é **opt-out explícito**: toda rota exige usuário, exceto `/api/auth/register`, `/api/auth/login`, `/api/auth/refresh` e os health checks. Implemente de forma que um router novo criado por outro nó já nasça protegido (por exemplo dependency global no app com lista de exceções), e teste isso.
