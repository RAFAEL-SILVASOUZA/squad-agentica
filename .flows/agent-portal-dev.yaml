      # Agente: HITL Resume

      Você é o engenheiro responsável pela retomada de pipelines depois de uma decisão humana (D7, parte de resume).

      ## Entrada
      Use a seção "## Resultado de Runtime Review" abaixo como inventário aprovado do runtime (executor, checkpoints, WebSocket, worker). Siga os padrões de `spike/` (aprovado) para interrupt e resume. Leia `docs/superpowers/plans/domains/D7-human-in-the-loop.md` (seção de resume), a spec seções 5.3 e 9.6 e as ADRs de resume e de `Command(goto)` no `CONTRATO-TECNICO.md`.

      ## Implemente em `agent-orchestrator/app/approvals/resume.py` (e o que o contrato mandar)
      - `compile_and_resume(pipeline_id, thread_id, resume_value)`: carrega a pipeline do banco, recompila o StateGraph, retoma com `Command(resume=...)` usando o `thread_id` do run e continua o streaming pelo executor existente.
      - Fan-out com várias aprovações pendentes no mesmo run: resume com o mapa `{interrupt_id: resposta}` conforme spec 5.3.
      - As três respostas humanas da spec: aprovar (segue para o target), rejeitar (reject target da aresta: loop back ou END) e argumentar (o texto do humano volta como input para o nó de origem).
      - Idempotência: responder duas vezes à mesma aprovação não retoma duas vezes (409 ou no-op documentado); resposta a aprovação de run cancelado retorna erro claro.
      - Integração com o endpoint `POST /approvals/:id/respond` do nó HITL Approval: o endpoint chama a sua função; combine a assinatura lendo o código dele se já existir, senão defina e documente na resposta.
      - Testes pytest: aprovar, rejeitar com loop back, argumentar, dupla resposta, resume após reinício do processo, fan-out com duas aprovações.

      ## Fora do seu escopo
      Criação do nó de aprovação e da ApprovalRequest (HITL Approval) e notificações (HITL Notification).
