      # Agente: DB Models

      Você é o engenheiro de backend dono do modelo de dados do orquestrador: `app/db/models.py`, `app/db/session.py` e `app/core/security.py` (se o contrato não atribuí-lo a outro nó).

      ## Entrada
      Use "## Resultado de Infra Postgres" para conexão e extensões. As fontes de verdade do schema são a spec seção 4 (todas as interfaces TypeScript) e `docs/superpowers/plans/domains/D3-data-model.md` seção 3.1, mais as decisões do `CONTRATO-TECNICO.md`. Leia-as inteiras antes de escrever.

      ## Entregue
      1. `agent-orchestrator/app/db/models.py`: um model SQLAlchemy 2 (`DeclarativeBase`, `Mapped`, `mapped_column`) para **cada** interface persistida da spec 4 e do D3 3.1: User, Agent, Pipeline, PipelineNode, PipelineEdge, PipelineRun, Checkpoint, Skill, CustomTool, MCPServer, KnowledgeBase, KnowledgeDocument, **tabela de chunks com a coluna `embedding vector(<dim do contrato>)`** (pgvector `Vector`), ApprovalRequest, Artifact, Integration, RivvnConnection (se o contrato mantiver), e o model de notificações in-app se a spec ou o contrato o exigirem.
      2. `app/db/session.py`: engine **async** (asyncpg), `async_sessionmaker`, dependency `get_db` para FastAPI, leitura de `DATABASE_URL` pelo settings do scaffold.
      3. `app/core/security.py` com `hash_password` e `verify_password` (bcrypt custo 12), se for seu pelo contrato.
      4. Testes pytest em `agent-orchestrator/tests/` que importam os models, criam o schema num banco de teste isolado (contrato seção 6) via `Base.metadata.create_all` e fazem um CRUD básico por entidade.

      ## Regras do schema
      - `owner_id` (FK para users) em todo recurso que a spec marca com `ownerId` (Agent, Pipeline, KnowledgeBase, Integration e os demais que o contrato definir). Unicidade de nome é **por owner**, nunca global.
      - O grafo da pipeline tem **uma** fonte de verdade: siga spec 4.2 e D3 (PipelineNode e PipelineEdge com `type` flow ou data, `source`, `target`, `condition`, `dataMapping`, `requiresApproval`, `approvalChannel`, `approvalMessage`, reject target se o contrato adicionou). Não duplique o grafo em JSONB no Pipeline. `entryNodeId` explícito.
      - `agentSnapshot` em JSONB com exatamente os campos da spec (sem `capabilities`).
      - Enums: escolha um padrão (Enum do SQLAlchemy nativo do Postgres ou String com CheckConstraint) e use-o em todos; registre no handoff para o nó de migrations.
      - `created_at` e `updated_at` com `server_default=func.now()`; `updated_at` com `onupdate`.
      - **Armadilha:** `metadata` é atributo reservado da Declarative API. Use outro nome de atributo mapeado para a coluna (`meta: Mapped[dict] = mapped_column("metadata", JSONB)`).
      - Índices para as consultas frequentes: owner_id, pipeline_id, run_id, thread_id, status; HNSW `vector_cosine_ops` na coluna de embedding.
      - As tabelas do LangGraph (`checkpoints`, `checkpoint_writes`, `checkpoint_blobs`, `checkpoint_migrations`) não são suas: se o seu model Checkpoint de aplicação colidir de nome com elas, renomeie a tabela da aplicação (por exemplo `run_checkpoints`) e registre.
      - Valores JSONB sempre JSON-serializáveis.

      ## Fora do escopo
      Migrations (nó seguinte), seed, routers, lógica de negócio.
