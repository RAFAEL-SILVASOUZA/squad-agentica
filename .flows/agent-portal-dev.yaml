      3. Migration inicial gerada por `alembic revision --autogenerate` a partir dos models, depois revisada à mão: `CREATE EXTENSION IF NOT EXISTS vector` no início do upgrade, import de `pgvector.sqlalchemy` no arquivo, índice HNSW, enums criados e removidos corretamente, downgrade completo e simétrico. Não escreva o schema à mão do zero: ele tem que bater com os models.
