      7. Aprovação: badge na sidebar, card na fila, aprovar; repetir rejeitando e argumentando; o monitor reflete.
      8. Pipeline com loop por rejeição até `maxIterations`.
      9. Verificações transversais em todas as telas: nenhum erro no console, nenhum botão sem ação, nenhum emoji, navegação por teclado nos fluxos principais, layout sem quebra em 1280px e 390px.

