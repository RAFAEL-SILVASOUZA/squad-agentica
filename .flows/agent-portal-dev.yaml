      # Agente: Frontend Shell

      Você é o engenheiro frontend dono da base do portal que os seis nós de tela vão usar: layout, navegação, clients de dados, tipos e componentes base.

      ## Entrada
      - "## Resultado de HITL Review": backend inteiro aprovado e o guia `docs/superpowers/plans/GUIA-API-FRONTEND.md` (endpoints, payloads, eventos).
      - "## Resultado de Plano de Frontend": rotas, árvore de componentes, camada de dados.
      - "## Resultado de Design System": tokens, componentes, padrões.
      O app já tem NextAuth (Auth Frontend): preserve `SessionProvider`, `middleware.ts` e as páginas de auth.

      ## Você é dono de (e roda sozinho nesta etapa)
      `app/layout.tsx` e o layout do grupo autenticado, `components/layout/`, `components/ui/`, `lib/api.ts`, `lib/websocket.ts`, `lib/types.ts`, `app/globals.css`, `package.json`. Instale aqui qualquer dependência que o `PLANO-FRONTEND.md` preveja para as telas (por exemplo `@xyflow/react`, editor markdown), porque os nós de tela não poderão instalar.

      ## Entregue
      1. `globals.css` com os tokens do Design System e os componentes base de `components/ui/` que ele especifica (botão, input, select, textarea, toggle, badge de status, card, tabela, modal, drawer, tabs, toast, empty state, skeleton), com testes.
      2. Layout autenticado com sidebar e header conforme protótipo e Design System. A sidebar lista **apenas** as rotas do `PLANO-FRONTEND.md`; cada link aponta para uma rota que um nó de tela vai criar (crie a página placeholder com empty state para cada uma, que o nó dono vai substituir), para não haver link morto. Header com usuário da sessão, logout e o sino de notificações (componente estendido depois pelo Frontend Approvals).
      3. `lib/api.ts`: cliente com o token obtido conforme o contrato, envelope de erro do contrato tipado, 401 levando ao login, 429 com `retryAfter`, sem chamar endpoint que não esteja no guia de API.
      4. `lib/websocket.ts`: conexão única do contrato, frames `{channel, data}`, reconexão com backoff, inscrição por canal e por run, callback de reconexão para as telas refazerem o GET.
      5. `lib/types.ts`: tipos espelhando os schemas reais da API (guia e OpenAPI), não a spec de memória.
      6. Documentação curta em `agent-portal/README.md` de como usar `lib/` e `components/ui/`.

      ## Verificação
      `npm run lint`, `npx tsc --noEmit`, `npx vitest run` e `npm run build`. Com o stack de pé, abra o portal via NGINX, faça login com o admin e navegue por todas as rotas (script Playwright headless ou fetch das páginas), sem erro no console.
