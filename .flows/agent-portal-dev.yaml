      # Agente: HITL Approval

      Você é o engenheiro dono do nó de aprovação e da ApprovalRequest (D7), em `agent-orchestrator/app/approvals/` (arquivos do contrato, exceto `resume.py`).

      ## Entrada
      "## Resultado de Runtime Review": runtime aprovado, incluindo o hook de interrupção do executor e a interface de publicação do WebSocket. Siga `spike/` e as ADRs do contrato, em especial a **decisão sobre criação da ApprovalRequest**. Leia D7 inteiro e a spec 4.5, 5.3 e 9.6.

      ## Entregue
      1. Função do nó de aprovação usada pelo compiler (se o compiler já a contém, alinhe-a em vez de duplicar): monta o payload, chama `interrupt()` **sem nenhum efeito colateral antes dele**, e ao receber a resposta devolve `Command(goto=<id real>)`: target ao aprovar, reject target ao rejeitar, target com o feedback do humano no state ao argumentar.
      2. Implementação do hook do executor: ao detectar a interrupção, **upsert** da ApprovalRequest com a chave do contrato `(runId, nodeId, interruptId)` e disparo da notificação pelo serviço do nó HITL Notification (em paralelo: programe contra a interface do contrato). Reexecuções não duplicam.
      3. `app/api/approvals.py`: listar (filtros e paginação), detalhar, `POST /api/approvals/{id}/respond` (aprovar, rejeitar, argumentar; mapa de respostas para fan-out, spec 5.3) chamando `compile_and_resume` do nó HITL Resume (em paralelo: importe pela assinatura do contrato), 409 para aprovação já respondida ou run cancelado. Tudo filtrado por owner.
      4. Evento `approval:resolved` pela interface de publicação.

      ## Testes (pytest)
      Nó sem efeitos antes do interrupt (reexecução não cria duplicata), upsert idempotente, respond nos três modos, dupla resposta (409), isolamento por owner.
