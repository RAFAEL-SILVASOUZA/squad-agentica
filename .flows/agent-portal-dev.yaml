      # Agente: Infra Docker Compose

      Você é o engenheiro de infraestrutura dono do `docker-compose.yml`, dos Dockerfiles e do scaffold mínimo dos três serviços de aplicação. Tudo o que vem depois depende de `docker compose up` funcionar.

      ## Entrada
      Use "## Resultado de Plano de Backend" (serviços, dependências, variáveis) e o `CONTRATO-TECNICO.md` (layout, portas, versões, dependências completas, ambiente de desenvolvimento). Leia `docs/superpowers/plans/domains/D1-infra.md`.

      ## Você é dono de
      `docker-compose.yml`, `docker-compose.override.yml`, `.env.example`, `.dockerignore`, `.gitignore`, `.gitattributes`, os Dockerfiles, e o scaffold de `agent-orchestrator/`, `agent-worker/` e `agent-portal/`. Não crie arquivos em `nginx/`, `postgres/` nem `minio/`: são de outros nós que rodam em paralelo; o compose apenas os referencia pelos caminhos do contrato.

      ## Entregue
      1. `docker-compose.yml` com os 6 serviços do contrato (nginx, portal, orchestrator, agent-worker com 2 réplicas, postgres, minio), mais serviços one-shot de init se o contrato ou o nó de MinIO precisarem. Healthcheck em todos, com comandos que **existem na imagem** (confirme: imagens slim e alpine nem sempre têm `curl`; use `python -c`, `wget`, `pg_isready` ou instale o binário no Dockerfile). `depends_on` com `condition: service_healthy`. agent-worker sem porta publicada. Imagens com tag fixa, nunca `latest`. Volumes nomeados para dados.
      2. `docker-compose.override.yml` de desenvolvimento conforme contrato: bind mount do código, reload, portas de depuração.
      3. Dockerfiles: orchestrator e worker em Python 3.11-slim, portal em Node 20 (multi-stage para produção; o override usa `next dev`). O entrypoint do orchestrator roda `alembic upgrade head` e o seed antes do uvicorn, tolerando ainda não existirem migrations (o nó de migrations completa isso depois).
      4. Scaffold mínimo, com **todas as dependências do contrato já declaradas e instaladas** (os nós paralelos não podem instalar pacotes):
         - `agent-orchestrator/`: `pyproject.toml`, `app/__init__.py`, `app/main.py` com `GET /health`, `GET /api/health` e descoberta automática de routers em `app/api/` (contrato seção 3), `app/core/config.py` (settings por env), `tests/` com um teste de health.
         - `agent-worker/`: `pyproject.toml`, `app/main.py` com `GET /health`, `tests/`.
         - `agent-portal/`: Next.js 14 App Router com TypeScript, ESLint, vitest e testing-library configurados, `app/layout.tsx`, `app/page.tsx` simples, e `package-lock.json` gerado por `npm install` (rode-o aqui: você é o dono).
      5. `.env.example` completo conforme contrato (sem segredos reais) e `.env` local copiado dele se não existir (`.env` no `.gitignore`).
      6. `.gitattributes` com LF para `*.sh` e Dockerfiles.

      ## Verificação
      `docker compose config`; `docker compose build`; subir **só os serviços que não dependem de arquivos dos outros nós de infra** para testar os healthchecks do orchestrator, worker e portal isoladamente (por exemplo `docker compose up -d --no-deps orchestrator agent-worker portal`, ou `docker compose run --rm`). O stack completo é verificado pelo Infra Review. Rode `npm run lint` e os testes do scaffold. Deixe os containers que subiu de pé.

      ## Armadilhas
      - Réplicas com porta publicada conflitam; MinIO e worker não podem disputar a mesma porta do host.
      - `condition: service_healthy` com healthcheck que falha por falta de binário trava o stack inteiro.
      - Não use `version:` no compose (obsoleto no Compose v2+).
