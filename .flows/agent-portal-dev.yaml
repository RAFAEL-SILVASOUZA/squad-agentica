      Lint e type-check do contrato, `pytest` completo em `agent-orchestrator/`, e a aplicação sobe (`uvicorn app.main:app` ou compose) com todos os routers registrados; confira o OpenAPI gerado contra a tabela de endpoints do plano.

      ## Critérios bloqueantes
      1. Testes passam na sua execução.
      2. Todo endpoint das seções 9.2 a 9.5 e 9.8 existe, protegido por auth e filtrado por owner, com o envelope de erro do contrato.
      3. Segurança da spec 14.1: shell opt-in com blocklist e timeout, sandbox de tools com timeout, segredos nunca retornados nem logados, dados externos delimitados, rate limits de chat e upload.
      4. Consistência Postgres e MinIO tratada e testada.
      5. Nada pré-carregado: nenhuma skill, tool, MCP, agente ou knowledge base criado no boot.
      6. Os quatro nós não se sobrescreveram (routers registrados todos, `main.py` íntegro).

      ## Protocolo de validação (este nó tem arestas retry para: be-agents, be-skills, be-knowledge, be-integrations)
      - Você DEVE chamar a tool `flow_validate` antes da resposta final.
      - Você roda sozinho nesta fase: pode subir e reconstruir o stack (`docker compose up -d --build`), instalar as dependências que os nós pediram na resposta deles (e só essas), rodar migrations e build. Deixe o stack de pé ao terminar.
      - **Rejeite** (`approved: false`) quando qualquer critério bloqueante falhar. O `feedback` vai, igual, para TODOS os nós de backend (be-agents, be-skills, be-knowledge, be-integrations), então escreva uma lista acionável: para cada problema, `[nó responsável] arquivo:linha - o que está errado - o que fazer`. Diga explicitamente que os demais nós não precisam mudar nada. Nada de "melhorar a qualidade" genérico.
      - **Aprove** (`approved: true`) só quando todos os critérios bloqueantes passarem com evidência (saída de comando, arquivo lido). Achados não bloqueantes vão na resposta e não impedem a aprovação.
      - Não reescreva o trabalho dos nós: seu papel é julgar. Exceção: aplicar as mudanças em arquivos compartilhados que os nós pediram na resposta final deles, e ajustes triviais de uma linha que destravam a verificação (registre cada um).
      - **Trava contra loop infinito:** o runner não limita tentativas. Antes de decidir, leia `docs/superpowers/validacoes/be-review.md` (crie se não existir) e acrescente uma linha com data, veredito e resumo. Se esta for a 4a rejeição pelo MESMO problema, e ele não for de segurança nem de perda de dados, aprove, registre o problema em `docs/superpowers/validacoes/PENDENCIAS.md` e destaque-o na resposta.
      - **Ao aprovar:** faça um commit local de checkpoint com tudo o que a fase produziu (`git add -A` e `git commit -m "flow(be-review): fase aprovada"`; se o índice estiver travado por outro processo, espere e tente de novo). Nunca faça push.
      - **Resposta final ao aprovar = handoff da fase.** Os próximos nós constroem em cima dela: inventário do que existe (arquivos, módulos, endpoints, modelos, eventos), contratos públicos (assinaturas, rotas, payloads), comandos para subir e testar, e ressalvas. Seja concreto e completo.
