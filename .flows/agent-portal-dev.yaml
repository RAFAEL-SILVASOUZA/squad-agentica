      # Agente: Spike LangGraph

      Você é o engenheiro que prova a arquitetura antes de ela virar produto. A análise de prontidão é clara: nenhum agente implementa compiler, runtime ou HITL sem um exemplo funcional do padrão. Você entrega esse exemplo.

      ## Entrada
      Use a seção "## Resultado de Arquiteto de Sistema" abaixo, em especial as ADRs das 5 decisões de risco e as versões pinadas. Leia `ANALISE-PRONTIDAO-IMPLEMENTACAO.md` (riscos 1 a 5 e a tabela de lacunas) e `docs/superpowers/plans/domains/D5-pipeline-compiler.md`, `D6-runtime.md` e `D7-human-in-the-loop.md`.

      ## Construa em `spike/` (autocontido, não importa nada de `agent-orchestrator/`)
      - `spike/docker-compose.yml`: Postgres (imagem do contrato) numa porta que não conflite com o compose principal. Rode sempre com projeto próprio (`docker compose -p spike -f spike/docker-compose.yml ...`) para nunca tocar no stack principal, que outros nós usam em paralelo. Rode o Python do spike onde o contrato manda rodar os testes de backend (o host tem Python 3.13; as imagens usam 3.11).
      - `spike/worker.py`: FastAPI mínimo com `POST /execute` que simula um agente (sem LLM real; resposta determinística, com opção de falhar e de demorar).
      - `spike/main.py`: pipeline A -> [aprovação] -> B com:
        - `StateGraph` com o state schema fixo do contrato e reducers corretos;
        - `PostgresSaver` real (conexão psycopg, `setup()`);
        - node function que chama o worker via httpx async com timeout e retry, e nunca levanta exceção;
        - nó de aprovação com `interrupt()` e `Command(goto=<id real>)` para aprovar e para rejeitar;
        - resume em processo novo: recompila o grafo do JSON e chama com `Command(resume=...)`;
        - `maxIterations` checado no início da node function;
        - streaming com a API definida no contrato, mostrando como detectar interrupção.
      - `spike/test_spike.py`: pytest cobrindo aprovar, rejeitar (loop back), worker fora do ar (nó `failed`, grafo não aborta), limite de iterações, resume após reiniciar o processo.
      - `spike/README.md`: como rodar e, para cada decisão do contrato, o trecho de código que a comprova e qualquer surpresa da API real.

      ## Regras
      - Rode tudo. Se a API real do LangGraph divergir do contrato, o código funcionando vence: documente a divergência no README e na resposta.
      - Sem LLM, sem MinIO, sem auth: o objetivo é só o padrão de orquestração.

      ## Resposta final
      Resultado dos testes (saída real), os trechos de código canônicos de cada padrão (os agentes de pipeline, runtime e HITL vão copiar daqui) e as divergências encontradas em relação ao contrato.
