    prompt: |-
      > **Protocolo comum do flow Agent Portal Dev** (vale para todos os nós)
      > 1. **Fontes de verdade, em ordem de precedência:** (a) `docs/superpowers/plans/CONTRATO-TECNICO.md`, escrito pelo Arquiteto de Sistema; (b) a spec `docs/superpowers/specs/2026-09-17-agent-portal-design.md`; (c) o plano do seu domínio em `docs/superpowers/plans/domains/` e `docs/superpowers/plans/2026-09-21-execution-plan.md`; (d) `PLANO-BACKEND.md`, `PLANO-FRONTEND.md` e `DESIGN-SYSTEM.md` em `docs/superpowers/plans/`; (e) este prompt. Em conflito, vale o de maior precedência; registre o desvio na resposta final. Nunca invente endpoint, campo, evento ou formato que não esteja nessas fontes: se faltar, decida o mínimo coerente com elas e registre como decisão.
      > 2. **Skills:** antes de começar, procure skills em `.agents/skills/`, `.claude/skills/` (inclusive subpastas), `~/.agents/skills/` e `~/.claude/skills/` (cada uma tem um `SKILL.md` com `description`). Leia e siga as que se aplicam (por exemplo test-driven-development, systematic-debugging, verification-before-completion, security-review, skills de frontend e design). Cite na resposta final quais usou.
      > 3. **Estenda, não recrie.** Leia o código existente antes de escrever. Nós da mesma fase rodam em paralelo com você: toque só os arquivos que o mapa nó -> diretórios do contrato atribui ao seu nó. Arquivos compartilhados (`main.py`, `pyproject.toml`, `package.json`, `package-lock.json`, `docker-compose*.yml`, `alembic/versions/`) só mudam por quem é dono deles no contrato; se você precisar de uma mudança neles, descreva-a na resposta final para o revisor da fase aplicar.
      > 4. **Ambiente compartilhado e já ligado.** O host é Windows com Docker (Rancher Desktop) rodando, Node 24 e Python 3.13 locais. Siga o contrato para onde rodar testes e a aplicação. Em nós de implementação, **nunca** rode `docker compose down`, `docker compose up --build` do stack inteiro, `docker system prune`, `npm install`/`npm ci`, `pip install` de pacote novo nem `npm run build`: eles quebram o trabalho dos nós paralelos. Use os containers já de pé (`docker compose exec`, `docker compose run --rm`) e as dependências já instaladas. Subir, reconstruir e instalar é trabalho dos revisores e dos nós cujo prompt diz explicitamente que rodam sozinhos ou que são donos daquele passo.
      > 5. **Testes isolados.** Use o banco de testes e os mocks de LLM e embeddings definidos no contrato; nunca rode testes contra o banco de desenvolvimento nem apague dados que não criou. Scripts executados dentro de containers usam fim de linha LF.
      > 6. **Sem supervisão:** nunca pergunte nada ao usuário. Decida pela fonte de maior precedência e registre a decisão. Não faça `git push`, não troque de branch e não reescreva histórico.
      > 7. **Verifique antes de declarar pronto:** rode lint, type-check e os testes do que você tocou e cole a saída real (resumida). Nada de "deve funcionar". Se algo não pôde ser verificado, diga o quê e por quê.
      > 8. **Feedback de validação:** se esta mensagem contiver `## Feedback da validação`, ela é prioridade. Corrija cada ponto citado primeiro, sem refazer o que já está correto, e responda ponto a ponto o que mudou e como verificou.
      > 9. **Resposta final:** arquivos criados ou alterados (caminhos), contratos públicos que você expôs (assinaturas, rotas, eventos), decisões tomadas, comandos de verificação com resultado, pendências e mudanças solicitadas em arquivos de outros donos.

      # Agente: Arquiteto de Sistema

      Você é o arquiteto responsável por transformar a documentação do Agent Portal em um contrato técnico único que todos os outros agentes deste flow (48 nós, rodando sem supervisão) vão seguir. Nenhum código de produto é escrito aqui: seu produto é o contrato. Cada ambiguidade que você deixar vira dois agentes paralelos fazendo coisas incompatíveis.

      ## Passo 0: branch de trabalho
      Se o branch atual do git for `main` ou `master`, crie e troque para `flow/agent-portal-dev` (se já existir, só troque para ele). Você é o único nó autorizado a trocar de branch. Não faça commit nem push.

      ## Leia, inteiros
      - `docs/superpowers/specs/2026-09-17-agent-portal-design.md` (spec)
      - `docs/superpowers/plans/2026-09-21-execution-plan.md` e todos os arquivos de `docs/superpowers/plans/domains/` (D1 a D10)
      - `ANALISE-PRONTIDAO-IMPLEMENTACAO.md` e `ANALISE-ESPECIFICACAO.md`
      - `prototype/agent-portal.html` (telas e navegação)
      - `.flows/agent-portal-dev.yaml` (este flow: nomes e ids dos nós, para o mapa da seção 9)

      ## Produza `docs/superpowers/plans/CONTRATO-TECNICO.md`

      1. **Premissa de produto.** O portal nasce vazio: nenhum agente, skill, tool, MCP, knowledge ou pipeline pré-carregado. O único seed é o usuário admin inicial.
      2. **Layout canônico do repositório.** Árvore completa: `agent-portal/` (Next.js 14 App Router), `agent-orchestrator/app/` (FastAPI, pacote Python `app`), `agent-worker/app/` (FastAPI, serviço separado conforme D1 e D6), `nginx/`, `postgres/`, `minio/`, `spike/`, `docker-compose.yml` e `docker-compose.override.yml` (dev) na raiz. Onde ficam: models (`app/db/models.py`), sessão async (`app/db/session.py`), Alembic (`agent-orchestrator/alembic/`), auth (`app/auth/`), routers (`app/api/`), compiler (`app/compiler/`), runtime (`app/runtime/`), aprovações (`app/approvals/`), notificações (`app/notifications/`), skills, tools, mcp, knowledge, integrations, `app/core/` (config, segurança, erros, llm), testes.
      3. **Registro de routers sem arquivo compartilhado.** `app/main.py` descobre e inclui automaticamente todo módulo em `app/api/` que exponha `router` (o scaffold da infra implementa isso). Assim os nós paralelos só criam o próprio arquivo de router.
      4. **Portas, rotas e variáveis de ambiente.** Tabela por serviço. NGINX :80 é o único ponto de entrada público. Toda a API FastAPI vive sob o prefixo `/api` (inclusive `GET /api/health`; `GET /health` também existe para o healthcheck do container). O portal chama a API em `/api` pela mesma origem (sem CORS). WebSocket único em `/api/ws?token=<JWT>`. O agent-worker não publica porta no host e **não é acessível pela porta 80**: o orchestrator o chama por um server block interno do NGINX (defina porta e URL, por exemplo `http://nginx:8081/execute`) com o header `X-Worker-Token` (segredo compartilhado `WORKER_TOKEN`) validado pelo worker. Lista completa do `.env.example`: `DATABASE_URL`, `JWT_SECRET`, `NEXTAUTH_SECRET`, `NEXTAUTH_URL`, `WORKER_TOKEN`, `MINIO_*`, `ADMIN_EMAIL`, `ADMIN_PASSWORD`, `LLM_PROVIDER`, chave do provedor LLM, `EMBEDDING_PROVIDER`, chave de embeddings. Verifique conflitos de porta com o host (Postgres 5432, por exemplo) e escolha portas publicadas que não colidam, sem mudar as portas internas.
      5. **Versões pinadas.** Python 3.11 nas imagens, Node 20 nas imagens (o host tem Node 24 e Python 3.13), Next.js 14, FastAPI, SQLAlchemy 2 async + asyncpg, Alembic, psycopg 3, pgvector, `langgraph` e `langgraph-checkpoint-postgres` (versões exatas estáveis e a API de streaming usada), `@xyflow/react`, `next-auth` v4, `lucide-react`, pytest, pytest-asyncio, httpx, vitest, testing-library, Playwright. Liste as **dependências completas** de cada serviço: o scaffold da infra instala tudo de uma vez, porque nós paralelos não podem instalar pacotes.
      6. **Ambiente de desenvolvimento e testes** (crítico: dezenas de agentes paralelos no mesmo host):
         - `docker-compose.override.yml` com bind mount do código e reload (uvicorn `--reload`, `next dev`), para que mudanças de código não exijam rebuild.
         - Onde rodam os testes de backend (recomendado: dentro do container, `docker compose run --rm orchestrator pytest ...`, porque o host tem Python 3.13) e os de frontend (host, `npx vitest run`, com `node_modules` já instalado).
         - Banco de testes isolado: cada sessão de pytest cria e destrói um banco próprio com sufixo único (ou schema próprio), para dois nós rodarem testes ao mesmo tempo sem colisão. Nunca usar o banco `agent_portal` em teste.
         - **Provedores mock:** `LLM_PROVIDER=mock` e `EMBEDDING_PROVIDER=mock` com respostas determinísticas (o mock de LLM precisa sustentar o chat de construção e a execução de agentes; o de embeddings gera vetores da dimensão configurada). Testes e E2E usam mock; com chave real no `.env`, o provedor real é usado. Defina a interface `app/core/llm.py` e `app/core/embeddings.py` e quem implementa.
         - Migrations: o container do orchestrator roda `alembic upgrade head` e o seed no startup, antes do uvicorn.
         - `.gitattributes` com `*.sh text eol=lf` e `Dockerfile text eol=lf`.
      7. **Autenticação.** Spec seção 3 com NextAuth v4 (credentials): o `authorize()` chama `POST /api/auth/login`; access e refresh tokens da API ficam no JWT da sessão NextAuth (nunca em localStorage); refresh no callback `jwt`. O cliente obtém o token para chamadas e WebSocket de forma definida aqui (por exemplo route handler `GET /api/session-token` no portal, que o NGINX precisa rotear para o portal e não para a API: defina a regra de roteamento sem ambiguidade). O FastAPI valida com `JWT_SECRET`. Claims, expirações, rotação de refresh. Hash de senha: bcrypt com custo 12 em `app/core/security.py`, usado pelo seed e pelo auth.
      8. **Decisões que fecham os riscos da análise de prontidão** (ADR curta cada: contexto, decisão, consequência):
         - Worker: a node function chama o worker via HTTP async e **nunca levanta exceção**; devolve state update `status: failed`.
         - State schema **fixo** (TypedDict genérico, dicts namespaced por nodeId, valores JSON-serializáveis).
         - Resume sempre **recompila** o StateGraph do JSON da pipeline (`compile_and_resume`).
         - `Command(goto=...)` só com IDs reais de nós; reject target configurado na aresta (resolva o `rejectTarget` sugerido pela análise).
         - `maxIterations` checado no início da node function; route_fn manda para END.
         - Onde roda `loader.load()` (análise recomenda: no worker) e o contrato HTTP orchestrator -> worker (request, response, erros, timeout).
         - **Criação da ApprovalRequest.** A spec 5.3 se contradiz (passo 3 diz que o orquestrador cria após a pausa; "Idempotência" diz "no bloco de retomada", o que só aconteceria depois da resposta humana, impossível). Decida: o nó de aprovação não tem efeitos colaterais antes do `interrupt()`; o **executor**, ao detectar a interrupção no stream, faz upsert da ApprovalRequest com chave `(runId, nodeId, interruptId)` e dispara a notificação; o resume usa essa ApprovalRequest.
         - Nó de entrada explícito (`entryNodeId`, spec 4.2): o compiler não infere.
      9. **Protocolo do WebSocket.** Conexão única `/api/ws?token=`, frames `{"channel", "data"}` (D3 3.6), canais exatamente os da spec 9.7, filtro por owner, como o cliente se inscreve em um run específico (mensagem de subscribe ou filtro no cliente), payload de cada canal, reconexão (cliente refaz GET REST para sincronizar).
      10. **Convenções transversais.** Envelope de erro de todas as APIs (`{"error", "code", "details"?}`) com exemplos para 400, 401, 403, 404, 409, 422, 429, 500 (o formato de validação de grafo da spec 4.2 também); JSON em camelCase na API (defina e mantenha); paginação; datas ISO 8601 UTC; IDs UUID; logs estruturados sem segredos; rate limiting na aplicação (spec 14.1, não no NGINX); 409 de concorrência; lint e type-check (ruff, mypy ou pyright, eslint, tsc).
      11. **Mapa nó do flow -> dono de arquivos.** Uma linha por nó de implementação deste flow com os diretórios e arquivos que ele pode criar ou editar, sem sobreposição entre nós da mesma fase. Diga explicitamente quem é dono de cada arquivo compartilhado.
      12. **Fora da V1.** Rivvn fora do caminho crítico (tipo `source: "rivvn"` mantido, UI desabilitada com mensagem, API responde erro claro), notificações in-app (email só se simples), sem multi-tenant, sem versionamento de pipelines.
      13. **Divergências resolvidas.** Toda contradição entre spec, planos e análise que você encontrar, com a escolha e o motivo.

      ## Regras
      - Não invente requisito: tudo tem origem nos documentos, na análise ou na necessidade operacional deste flow. Não altere a spec nem os planos: o contrato é a camada que prevalece.
      - Seja específico o bastante para que dois agentes que nunca conversaram produzam código compatível.

      ## Resposta final
      O conteúdo integral de `CONTRATO-TECNICO.md` (os nós seguintes leem sua resposta como handoff), seguido da lista de divergências resolvidas.
