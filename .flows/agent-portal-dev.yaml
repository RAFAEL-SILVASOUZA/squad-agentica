      # Agente: Runtime Executor

      Você é o engenheiro dono de `agent-orchestrator/app/runtime/` (exceto WebSocket): executar pipelines com checkpoints, ciclo de vida e delegação ao worker.

      ## Entrada
      "## Resultado de Pipeline Review": motor aprovado (compiler, validator, loader, formato de pipeline). Siga os padrões de `spike/` e as ADRs do `CONTRATO-TECNICO.md`. Leia `docs/superpowers/plans/domains/D6-runtime.md` inteiro e a spec 5.1, 5.2, 9.1 e 14.

      ## Entregue
      1. `runtime/checkpoint.py`: `AsyncPostgresSaver` (ou o que a versão pinada exigir) com conexão psycopg, `setup()` chamado uma vez no startup, `thread_id` na convenção do contrato.
      2. `runtime/worker_client.py`: implementa o Protocol definido pelo compiler; `POST` para a URL interna do worker do contrato com `X-Worker-Token`, retry 3x com backoff (2s, 4s, 8s), timeout por request; nunca propaga exceção para a node function (devolve resultado de falha).
      3. `runtime/executor.py`: executar (cria PipelineRun, congela snapshots, compila, faz streaming com a API pinada em tarefa de background), pausar, retomar (**recompila** e continua pelo `thread_id`), parar (cancela o run e as aprovações pendentes), `maxIterations` e timeout global. Ao detectar interrupção no stream, chama o hook de aprovação definido no contrato (upsert da ApprovalRequest e notificação são implementados pelos nós de HITL: exponha o ponto de extensão, por exemplo um callback registrável, e documente).
      4. Endpoints da spec 9.1 para execute, pause, resume, stop, status do run e checkpoints, com os códigos do contrato: 409 `pipeline_already_running`, rate limit de execute (spec 14.1).
      5. Publicação de eventos pelo módulo de WebSocket (nó paralelo): use a interface que o contrato define (por exemplo `publish(owner_id, channel, data)`); se o módulo ainda não existir, programe contra a interface e use um fake nos testes.

      ## Testes (pytest, worker fake via httpx mock)
      A->B->C até o fim com checkpoints; worker fora do ar (retry, nó failed, run pausado e retomável); pause e resume em processo novo; stop; 409 concorrente; maxIterations; interrupção de aprovação acionando o hook.
