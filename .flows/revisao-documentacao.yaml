version: 2
name: Revisão de Documentação
nodes:
  - id: carregar-doc
    name: Carregar Documento
    prompt: |-
      # Agente: Carregar Documento
      Leia o documento de especificação do Agent Portal em:
      docs/superpowers/specs/2026-09-17-agent-portal-design.md
      
      Retorne o conteúdo completo do documento, preservando a estrutura de seções.
      Não resuma, não analise - apenas carregue e devolva o texto integral.
    x: 40
    y: 280
  - id: contexto-projeto
    name: Contexto do Projeto
    prompt: |-
      # Agente: Contexto do Projeto
      Mapeie o contexto atual do projeto para embasar a revisão.
      
      Colete:
      1. Estrutura de diretórios (use glob)
      2. Arquivos de configuração existentes (package.json, pyproject.toml, docker-compose.yml)
      3. Flows existentes em .flows/
      4. Qualquer documentação adicional em docs/
      
      Retorne um resumo estruturado do estado atual do projeto.
    x: 40
    y: 560
  - id: revisor-arquitetura
    name: Revisor de Arquitetura
    prompt: |-
      # Agente: Revisor de Arquitetura
      Revise as decisões de arquitetura da especificação.
      
      Use a seção "## Resultado de Carregar Documento" como o documento a revisar.
      Use a seção "## Resultado de Contexto do Projeto" como contexto do projeto.
      
      Foque em:
      - Coerência das decisões técnicas (LangGraph, pgvector, Docker Compose)
      - Adequação da stack para o escopo V1
      - Riscos arquiteturais identificados e não identificados
      - Alternativas não consideradas que merecem atenção
      - Complexidade vs benefício de cada decisão
      
      Retorne uma lista de achados com severidade (crítico, alto, médio, baixo) e recomendações.
    x: 360
    y: 80
  - id: revisor-completude
    name: Revisor de Completude
    prompt: |-
      # Agente: Revisor de Completude
      Verifique se a especificação está completa.
      
      Use a seção "## Resultado de Carregar Documento" como o documento a revisar.
      Use a seção "## Resultado de Contexto do Projeto" como contexto do projeto.
      
      Foque em:
      - Itens de escopo V1 sem especificação detalhada
      - Interfaces/APIs mencionadas mas não documentadas
      - Casos de borda não cobertos
      - Dependências não declaradas
      - Fluxos de erro não especificados
      - Configurações necessárias não documentadas
      
      Retorne uma lista de lacunas com prioridade e descrição do que falta.
    x: 360
    y: 280
  - id: revisor-consistencia
    name: Revisor de Consistência
    prompt: |-
      # Agente: Revisor de Consistência
      Verifique a consistência interna da especificação.
      
      Use a seção "## Resultado de Carregar Documento" como o documento a revisar.
      
      Foque em:
      - Contradições entre seções
      - Termos usados de forma inconsistente
      - Interfaces que não batem entre definição e uso
      - Fluxos descritos de forma diferente em seções diferentes
      - Decisões de arquitetura que conflitam entre si
      
      Retorne uma lista de inconsistências com referências às seções envolvidas.
    x: 360
    y: 480
  - id: revisor-claridade
    name: Revisor de Clareza
    prompt: |-
      # Agente: Revisor de Clareza
      Avalie a clareza e legibilidade da especificação.
      
      Use a seção "## Resultado de Carregar Documento" como o documento a revisar.
      
      Foque em:
      - Seções confusas ou ambíguas
      - Terminologia técnica não explicada
      - Exemplos insuficientes ou faltantes
      - Estrutura que dificulta a navegação
      - Diagramas ou ilustrações que ajudariam
      
      Retorne uma lista de melhorias de clareza com sugestões específicas de reescrita.
    x: 360
    y: 680
  - id: compilador-relatorio
    name: Compilador de Relatório
    prompt: |-
      # Agente: Compilador de Relatório
      Compile todos os achados dos revisores em um relatório final.
      
      Você receberá quatro seções de revisão:
      - "## Resultado de Revisor de Arquitetura"
      - "## Resultado de Revisor de Completude"
      - "## Resultado de Revisor de Consistência"
      - "## Resultado de Revisor de Clareza"
      
      Produza um relatório estruturado com:
      1. Resumo executivo (3-5 parágrafos)
      2. Achados críticos (todos os revisores)
      3. Achados por categoria (arquitetura, completude, consistência, clareza)
      4. Recomendações priorizadas para ação imediata
      5. Itens para consideração futura
      
      Não liste problemas - apresente a documentação final já corrigida onde possível,
      ou com instruções claras de correção.
    x: 680
    y: 380
edges:
  - from: carregar-doc
    to: revisor-arquitetura
    type: data
  - from: carregar-doc
    to: revisor-completude
    type: data
  - from: carregar-doc
    to: revisor-consistencia
    type: data
  - from: carregar-doc
    to: revisor-claridade
    type: data
  - from: contexto-projeto
    to: revisor-arquitetura
    type: data
  - from: contexto-projeto
    to: revisor-completude
    type: data
  - from: revisor-arquitetura
    to: compilador-relatorio
    type: data
  - from: revisor-completude
    to: compilador-relatorio
    type: data
  - from: revisor-consistencia
    to: compilador-relatorio
    type: data
  - from: revisor-claridade
    to: compilador-relatorio
    type: data